[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pianokt-backend"
version = "0.1.0"
requires-python = "==3.13.12"
dependencies = ["parangonar==3.3.3", "mido>=1.3,<2", "pretty-midi>=0.2.11,<0.3", "numpy>=2,<3", "pandas>=2.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "google-cloud-storage>=3,<4", "google-cloud-pubsub>=2.25,<3", "deltalake>=1,<2", "pyarrow>=18,<26"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
spark = ["pyspark==4.0.1", "delta-spark==4.0.0"]
[project.scripts]
pianokt-data = "pianokt_backend.cli:main"
[tool.setuptools.packages.find]
include = ["pianokt_backend*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
