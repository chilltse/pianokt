const state={page:'all',fav:new Set([2,5]),filter:'all',libraryPage:1,query:'',hf:'All',hs:'recent',open:new Set(),hp:{},rank:'count'};const main=document.querySelector('#main');const css=s=>s.replaceAll(' ','');const money=v=>v===null?'—':v.toFixed(1)+'%';const progress=(p,s)=>`<div class="progress ${css(s)}" role="progressbar" aria-label="Completion" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;const status=s=>`<span class="status ${css(s)}">${s==='Succeeded'?'✓ ':''}${s}</span>`;const dots=n=>`<span class="dots">${'●'.repeat(n)}<span class="off">${'●'.repeat(5-n)}</span></span> <small>Lv. ${n}</small>`;const heart=s=>`<button class="ghost icon heart ${state.fav.has(s.id)?'on':''}" data-fav="${s.id}" aria-label="${state.fav.has(s.id)?'Remove from':'Add to'} favorites" aria-pressed="${state.fav.has(s.id)}">${state.fav.has(s.id)?'♥':'♡'}</button>`;const launch=(s,cls='',label='Challenge')=>`<button class="${cls}" data-challenge="${s.id}">${label}</button>`;

function historySlice(s){const pages=Math.max(1,Math.ceil(s.a.length/PAGE_SIZE));const page=Math.min(pages,Math.max(1,state.hp[s.id]||1));const start=(page-1)*PAGE_SIZE;return {page,pages,start,rows:s.a.slice(start,start+PAGE_SIZE)};}
function chart(s,slice){let a=slice.rows.map((v,i)=>({v,n:s.a.length-slice.start-i})).reverse(),x=i=>a.length===1?178:38+i*270/(a.length-1),y=p=>112-p*.92;return `<svg role="img" aria-label="Completion and accuracy for attempts ${a[0]?.n} through ${a.at(-1)?.n}" class="chart" viewBox="0 0 330 140">${[0,50,90,100].map(p=>`<line x1="30" x2="315" y1="${y(p)}" y2="${y(p)}" stroke="${p===90?'#8ab69a':'#e7e5e4'}" stroke-dasharray="${p===90?'4 4':'0'}"/><text x="25" y="${y(p)+3}" text-anchor="end" font-size="9" fill="#78716c">${p}%</text>`).join('')}${[1,0].map((k,i)=>`<polyline points="${a.map((v,j)=>`${x(j)},${y(v.v[k])}`).join(' ')}" fill="none" stroke="${i?'#329568':'#c4a15b'}" stroke-width="1.8" ${i?'stroke-dasharray="4 2"':''}/>${a.map((v,j)=>`<circle cx="${x(j)}" cy="${y(v.v[k])}" r="2.6" fill="${i?'#329568':'#c4a15b'}" stroke="white"><title>Attempt #${v.n}: ${v.v[k].toFixed(1)}%</title></circle>`).join('')}`).join('')}${a.map((v,j)=>`<text x="${x(j)}" y="130" text-anchor="middle" font-size="9" fill="#78716c">#${v.n}</text>`).join('')}</svg><div class="legend"><span>Completion</span><span>Accuracy (partial or full)</span></div>`}
function pager(s,q){return `<div class="row history-pager"><small>Showing ${q.start+1}–${q.start+q.rows.length} of ${s.a.length} · Page ${q.page} of ${q.pages}</small><button data-hpage="${s.id}:${q.page-1}" ${q.page<=1?'disabled':''}>‹ Newer</button><button data-hpage="${s.id}:${q.page+1}" ${q.page>=q.pages?'disabled':''}>Older ›</button></div>`;}
function historyCard(s){let open=state.open.has(s.id),q=historySlice(s);return `<article class="panel history-card"><div class="row"><div class="note">♫</div><div class="title-group"><h3>${s.name}</h3><small>${s.composer}</small><div>${dots(s.level)}</div></div>${status(s.status)}</div><div class="metric-layout"><div class="metric"><div class="row between"><small>Best Completion</small><b>${s.p}%</b></div>${progress(s.p,s.status)}</div><div class="metric"><small>Best Accuracy</small><strong class="${s.status==='Succeeded'?'Succeeded':''}">${money(s.best)}</strong></div></div>${s.status==='In Progress'?`<small>You've reached ${s.p}% of this song. Keep going!</small>`:s.status==='Completed'?'<small>Full challenge completed. Reach 90% accuracy to succeed.</small>':''}<div class="rule"></div><div class="row footer-row"><small>◷ ${s.a.length} attempts · ${s.a[0][2].split(',')[0]}</small><div class="spacer"></div><button class="ghost" data-details="${s.id}" aria-expanded="${open}">${open?'Hide details ⌃':'Details ›'}</button>${launch(s,'',s.status==='Succeeded'?'Replay':'Challenge')}</div>${open?`<div class="details" id="history-${s.id}"><div class="row between"><h3>Challenge History</h3><small>${s.a.length} attempts</small></div>${pager(s,q)}${chart(s,q)}${q.rows.map((a,i)=>{let as=a[3]?(a[0]>=90?'Succeeded':'Completed'):'Incomplete';return `<div class="attempt"><div class="row between"><div class="title-group"><h3>Attempt #${s.a.length-q.start-i}</h3><small>${a[2]}</small></div>${status(as)}</div><div class="metric-layout"><div class="metric"><div class="row between"><small>Completion</small><small>${a[1]}%</small></div>${progress(a[1],as)}</div><div class="metric"><small>${a[3]?'Accuracy':'Partial Accuracy'}</small><b>${money(a[0])}</b></div></div>${a[3]&&a[0]===s.best?'<small style="color:#a16207">♕ Personal best</small>':''}</div>`}).join('')}${pager(s,q)}</div>`:''}</article>`}
function history(){let h=songs.filter(s=>s.a.length),r=h.filter(s=>state.hf==='All'||s.status===state.hf).sort((a,b)=>state.hs==='accuracy'?(b.best??-1)-(a.best??-1):state.hs==='completion'?b.p-a.p:state.hs==='attempts'?b.a.length-a.a.length:Number(b.a[0][2].match(/Nov (\d+)/)?.[1]||0)-Number(a.a[0][2].match(/Nov (\d+)/)?.[1]||0)||b.a[0][2].localeCompare(a.a[0][2]));main.innerHTML=`<div class="intro"><h1>Challenged Songs</h1><p class="muted">Every attempt is a step forward. Track your progress and revisit your best performances.</p></div><div class="stats">${[['♫',h.length,'Challenged Songs'],['♕',h.filter(s=>s.status==='Succeeded').length,'Succeeded'],['⚑',h.reduce((n,s)=>n+s.a.filter(a=>a[3]).length,0),'Full Challenges']].map(([i,n,l])=>`<div class="panel stat"><span class="ico">${i}</span><strong class="${l==='Succeeded'?'Succeeded':''}">${n}</strong><small>${l}</small></div>`).join('')}</div><section class="section"><div class="tabs">${['All','In Progress','Completed','Succeeded'].map(f=>tab(f,f==='All'?`All (${h.length})`:f,state.hf,'hf')).join('')}</div><div class="tools"><small>${r.length} songs</small><span class="spacer"></span><select id="hs" aria-label="Sort history"><option value="recent">Recently played</option><option value="completion">Best completion</option><option value="accuracy">Best accuracy</option><option value="attempts">Most attempts</option></select></div><div class="history-list">${r.length?r.map(historyCard).join(''):'<div class="panel empty">No matching challenges.</div>'}</div></section>`;document.querySelector('#hs').value=state.hs}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.page===state.page)b.setAttribute('aria-current','page')});({all,history}[state.page])()};let noticeTimer;function notify(msg){let n=document.querySelector('#notice');n.textContent=msg;n.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.add('hidden'),3000)}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page){state.page=d.page;render();window.scrollTo(0,0)}else if(d.fav){let id=+d.fav;state.fav.has(id)?state.fav.delete(id):state.fav.add(id);document.querySelectorAll(`[data-fav="${id}"]`).forEach(el=>{el.outerHTML=heart(songs.find(s=>s.id===id))});if(state.page==='all')refreshLibrary()}else if(d.filter){state.filter=d.filter;state.libraryPage=1;refreshLibrary()}else if(d.lpage){state.libraryPage=+d.lpage;refreshLibrary()}else if(d.preview){notify('Preview control — uses the original MIDI player when integrated.')}else if(d.hf){state.hf=d.hf;state.open.clear();history()}else if(d.details){let id=+d.details;if(state.open.has(id)){state.open.delete(id)}else{state.open.clear();state.open.add(id);state.hp[id]=1;}let y=window.scrollY;history();window.scrollTo(0,y);document.querySelector(`[data-details="${id}"]`)?.focus({preventScroll:true})}else if(d.hpage){const [id,page]=d.hpage.split(':').map(Number);state.hp[id]=page;history();document.getElementById('history-'+id)?.scrollIntoView({block:'start',behavior:'instant'});}else if(d.reset!==undefined){state.query='';state.filter='all';state.libraryPage=1;all()}else if(d.challenge){notify('Demo only — use the existing PianoKT challenge entry when integrated.') }});document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;state.libraryPage=1;refreshLibrary()}});document.addEventListener('change',e=>{let id=e.target.id;if(id==='hs'){state.hs=e.target.value;history()}});render();</script></body></html>
